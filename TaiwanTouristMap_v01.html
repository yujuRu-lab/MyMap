<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣玩透透 | 互動旅遊地圖 Taiwan Travel Map</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans TC"', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                            800: '#065f46',
                            900: '#064e3b',
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Noto Sans TC', sans-serif;
        }
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        /* Custom Leaflet Pin Styling */
        .custom-marker {
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            font-weight: bold;
            box-shadow: 0 4px 10px rgba(0,0,0,0.25);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 2px solid white;
        }
        .custom-marker:hover {
            transform: scale(1.25) translateY(-4px);
            z-index: 1000 !important;
        }
        .leaflet-popup-content-wrapper {
            border-radius: 1rem;
            padding: 0;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }
        .leaflet-popup-content {
            margin: 0 !important;
            line-height: 1.5;
            width: 260px !important;
        }
        /* Polyline dash animation */
        .leaflet-interactive.route-polyline {
            stroke-dasharray: 8, 8;
            animation: dash 25s linear infinite;
        }
        @keyframes dash {
            to { stroke-dashoffset: -1000; }
        }
        /* Pulse Animation for active spots */
        .pulse-ring {
            animation: pulse-ring 2s infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1.1); box-shadow: 0 0 0 12px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 h-screen flex flex-col overflow-hidden">

    <header class="bg-white border-b border-slate-200 z-30 flex-none shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-3">
            <!-- Brand Logo -->
            <div class="flex items-center gap-3 cursor-pointer select-none" onclick="resetFilters()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-teal-500 to-emerald-400 flex items-center justify-center text-white shadow-md">
                    <i class="fa-solid fa-map-location-dot text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base sm:text-lg leading-tight text-slate-900 tracking-wide flex items-center gap-2">
                        台灣玩透透 <span class="text-[10px] sm:text-xs bg-brand-100 text-brand-700 px-2 py-0.5 rounded-full font-bold">互動地圖</span>
                    </h1>
                    <p class="text-[11px] text-slate-400 hidden sm:block">Taiwan Travel Explorer & Route Planner</p>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="flex-1 max-w-md relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
                <input type="text" id="searchInput" oninput="handleSearch()" placeholder="搜尋景點名稱、縣市或關鍵字..." 
                    class="w-full pl-10 pr-8 py-2 text-xs sm:text-sm bg-slate-100 focus:bg-white border border-transparent focus:border-brand-500 rounded-full outline-none transition duration-150">
                <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 text-xs">
                    <i class="fa-solid fa-circle-xmark"></i>
                </button>
            </div>

            <!-- Header Action Buttons -->
            <div class="flex items-center gap-1.5 sm:gap-2">
                <!-- Add Custom Spot Button -->
                <button onclick="openAddSpotModal()" title="新增景點" class="p-2 sm:px-3.5 sm:py-2 text-slate-700 hover:text-brand-600 hover:bg-brand-50 rounded-full sm:rounded-xl border border-slate-200 text-xs sm:text-sm font-medium transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid fa-plus text-brand-600 text-sm sm:text-base"></i>
                    <span class="hidden md:inline">新增景點</span>
                </button>

                <!-- Surprise Me / Random Spot Button -->
                <button onclick="openSurpriseModal()" title="隨機推薦景點" class="p-2 sm:px-3.5 sm:py-2 text-slate-700 hover:text-brand-600 hover:bg-brand-50 rounded-full sm:rounded-xl border border-slate-200 text-xs sm:text-sm font-medium transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid fa-dice text-brand-600 text-sm sm:text-base"></i>
                    <span class="hidden md:inline">今天去哪玩？</span>
                </button>

                <!-- Favorites Filter Button -->
                <button onclick="toggleFavoriteFilter()" id="favFilterBtn" title="我的收藏" class="p-2 sm:px-3.5 sm:py-2 text-slate-700 hover:text-rose-600 hover:bg-rose-50 rounded-full sm:rounded-xl border border-slate-200 text-xs sm:text-sm font-medium transition flex items-center gap-1.5 shadow-2xs">
                    <i class="fa-solid fa-heart text-rose-500 text-sm sm:text-base"></i>
                    <span class="hidden md:inline">收藏</span>
                    <span id="favBadgeCount" class="bg-rose-500 text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">0</span>
                </button>

                <!-- Itinerary Drawer Button -->
                <button onclick="toggleItineraryDrawer()" title="自訂行程" class="p-2 sm:px-3.5 sm:py-2 bg-brand-600 hover:bg-brand-700 text-white rounded-full sm:rounded-xl shadow-sm text-xs sm:text-sm font-medium transition flex items-center gap-1.5">
                    <i class="fa-solid fa-route text-sm sm:text-base"></i>
                    <span class="hidden md:inline">自訂行程</span>
                    <span id="itineraryBadgeCount" class="bg-amber-300 text-slate-900 text-[10px] px-1.5 py-0.2 rounded-full font-black">0</span>
                </button>
            </div>
        </div>
    </header>

    <div class="bg-white border-b border-slate-200 px-4 py-2 z-20 shadow-xs flex-none">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-start md:items-center justify-between gap-2 overflow-x-auto no-scrollbar py-0.5">
            
            <!-- Region Filter Buttons -->
            <div id="regionGroup" class="flex items-center gap-1 flex-nowrap shrink-0">
                <span class="text-xs font-bold text-slate-400 mr-1 flex items-center gap-1">
                    <i class="fa-solid fa-earth-asia text-brand-600"></i> 地區:
                </span>
                <button onclick="filterRegion('ALL')" class="region-btn active px-3 py-1 rounded-lg text-xs font-medium transition bg-brand-600 text-white">全部</button>
                <button onclick="filterRegion('北部')" class="region-btn px-3 py-1 rounded-lg text-xs font-medium transition bg-slate-100 text-slate-600 hover:bg-slate-200">北部</button>
                <button onclick="filterRegion('中部')" class="region-btn px-3 py-1 rounded-lg text-xs font-medium transition bg-slate-100 text-slate-600 hover:bg-slate-200">中部</button>
                <button onclick="filterRegion('南部')" class="region-btn px-3 py-1 rounded-lg text-xs font-medium transition bg-slate-100 text-slate-600 hover:bg-slate-200">南部</button>
                <button onclick="filterRegion('東部')" class="region-btn px-3 py-1 rounded-lg text-xs font-medium transition bg-slate-100 text-slate-600 hover:bg-slate-200">東部</button>
                <button onclick="filterRegion('離島')" class="region-btn px-3 py-1 rounded-lg text-xs font-medium transition bg-slate-100 text-slate-600 hover:bg-slate-200">離島</button>
            </div>

            <div class="hidden md:block w-px h-4 bg-slate-200"></div>

            <!-- Category Filter Buttons -->
            <div id="categoryGroup" class="flex items-center gap-1.5 flex-nowrap shrink-0">
                <span class="text-xs font-bold text-slate-400 mr-1 flex items-center gap-1">
                    <i class="fa-solid fa-tags text-brand-600"></i> 主題:
                </span>
                <button onclick="filterCategory('ALL')" class="cat-btn active px-3 py-1 rounded-full text-xs font-medium border border-slate-200 bg-slate-800 text-white">全部主題</button>
                <button onclick="filterCategory('自然景觀')" class="cat-btn px-3 py-1 rounded-full text-xs font-medium border border-slate-200 bg-white text-slate-600 hover:border-brand-500">🌲 自然景觀</button>
                <button onclick="filterCategory('人文古蹟')" class="cat-btn px-3 py-1 rounded-full text-xs font-medium border border-slate-200 bg-white text-slate-600 hover:border-brand-500">🏛️ 人文古蹟</button>
                <button onclick="filterCategory('夜市美食')" class="cat-btn px-3 py-1 rounded-full text-xs font-medium border border-slate-200 bg-white text-slate-600 hover:border-brand-500">🍜 夜市美食</button>
                <button onclick="filterCategory('親子休閒')" class="cat-btn px-3 py-1 rounded-full text-xs font-medium border border-slate-200 bg-white text-slate-600 hover:border-brand-500">🎡 親子休閒</button>
                <button onclick="filterCategory('拍照打卡')" class="cat-btn px-3 py-1 rounded-full text-xs font-medium border border-slate-200 bg-white text-slate-600 hover:border-brand-500">📸 拍照打卡</button>
            </div>
        </div>
    </div>

    <main class="flex-1 relative flex overflow-hidden">
        
        <!-- Mobile Toggle Switch Bar (Visible only on mobile) -->
        <div class="md:hidden absolute top-3 left-3 z-20 flex bg-white/95 backdrop-blur-md rounded-xl p-1 shadow-md border border-slate-200 text-xs font-medium">
            <button id="mobileShowListBtn" onclick="setMobileView('list')" class="px-3 py-1.5 rounded-lg bg-brand-600 text-white font-bold transition">
                <i class="fa-solid fa-list mr-1"></i>清單 (<span id="mobileSpotCount">0</span>)
            </button>
            <button id="mobileShowMapBtn" onclick="setMobileView('map')" class="px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition">
                <i class="fa-solid fa-map mr-1"></i>地圖
            </button>
        </div>

        <!-- Left Sidebar Spots List Panel -->
        <aside id="sidebar" class="w-full md:w-[380px] lg:w-[420px] bg-slate-50 border-r border-slate-200 flex flex-col z-10 flex-none h-full transition-all duration-300">
            <!-- Sidebar Header Stats Bar -->
            <div class="px-4 py-3 bg-white border-b border-slate-200 flex items-center justify-between text-xs text-slate-500 font-medium">
                <div>
                    找到 <span id="spotsCount" class="font-bold text-brand-600 text-sm">0</span> 個景點
                </div>
                <button onclick="resetFilters()" class="text-slate-400 hover:text-brand-600 transition flex items-center gap-1">
                    <i class="fa-solid fa-rotate-left"></i> 重設篩選
                </button>
            </div>

            <!-- Spots List Scroll Area -->
            <div id="spotsContainer" class="flex-1 overflow-y-auto p-3 space-y-3">
                <!-- Attraction Cards Injected Here -->
            </div>

            <!-- Empty State -->
            <div id="emptyState" class="hidden flex-1 flex flex-col items-center justify-center p-6 text-center text-slate-400">
                <i class="fa-solid fa-compass-drafting text-4xl mb-2 text-slate-300"></i>
                <p class="font-bold text-slate-600 text-sm">找不到符合條件的台灣景點</p>
                <p class="text-xs mt-1 text-slate-400">請嘗試更換主題分類、切換地區或搜尋關鍵字</p>
                <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-xs font-bold rounded-xl shadow-xs transition">
                    清除所有條件
                </button>
            </div>
        </aside>

        <!-- Right Map Container -->
        <section class="flex-1 h-full relative">
            <div id="map" class="w-full h-full z-0"></div>

            <!-- Floating Map Layer Controls (Top Right) -->
            <div class="absolute top-4 right-4 z-10 flex flex-col gap-2">
                <!-- Map Layer Switch Dropdown -->
                <div class="relative group">
                    <button id="layerToggleBtn" title="切換地圖圖層" class="bg-white/95 backdrop-blur-md hover:bg-white text-slate-700 p-2.5 rounded-xl shadow-md border border-slate-200 transition flex items-center justify-center">
                        <i class="fa-solid fa-layer-group text-base text-brand-600"></i>
                    </button>
                    <!-- Layer Options Popup Menu -->
                    <div id="layerMenu" class="hidden group-hover:block absolute right-0 top-11 bg-white border border-slate-200 rounded-xl shadow-xl p-2 w-36 space-y-1 text-xs font-medium">
                        <button onclick="switchTileLayer('standard')" class="w-full text-left px-2.5 py-1.5 rounded-lg flex items-center gap-2 hover:bg-slate-100 text-slate-700">
                            <i class="fa-solid fa-map text-emerald-500"></i> 標準街道圖
                        </button>
                        <button onclick="switchTileLayer('satellite')" class="w-full text-left px-2.5 py-1.5 rounded-lg flex items-center gap-2 hover:bg-slate-100 text-slate-700">
                            <i class="fa-solid fa-globe text-sky-500"></i> 衛星影像圖
                        </button>
                        <button onclick="switchTileLayer('dark')" class="w-full text-left px-2.5 py-1.5 rounded-lg flex items-center gap-2 hover:bg-slate-100 text-slate-700">
                            <i class="fa-solid fa-moon text-indigo-500"></i> 暗夜奢華圖
                        </button>
                    </div>
                </div>

                <!-- Recenter Taiwan View Button -->
                <button onclick="resetMapView()" title="回到台灣全圖" class="bg-white/95 backdrop-blur-md hover:bg-white text-slate-700 p-2.5 rounded-xl shadow-md border border-slate-200 transition flex items-center justify-center">
                    <i class="fa-solid fa-crosshairs text-base"></i>
                </button>

                <!-- Geolocation Button -->
                <button onclick="locateUser()" title="我的當前定位" class="bg-white/95 backdrop-blur-md hover:bg-white text-slate-700 p-2.5 rounded-xl shadow-md border border-slate-200 transition flex items-center justify-center">
                    <i class="fa-solid fa-location-arrow text-base text-blue-500"></i>
                </button>
            </div>

            <!-- Bottom Right Map Legend (Desktop) -->
            <div class="hidden lg:flex absolute bottom-6 right-6 z-10 bg-white/90 backdrop-blur-md px-3.5 py-2.5 rounded-2xl shadow-md border border-slate-200 text-xs gap-3 text-slate-600 font-medium">
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-emerald-500"></span>自然景觀</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-amber-500"></span>人文古蹟</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-rose-500"></span>夜市美食</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-sky-500"></span>親子休閒</div>
                <div class="flex items-center gap-1.5"><span class="w-3 h-3 rounded-full bg-purple-500"></span>拍照打卡</div>
            </div>
        </section>
    </main>

    <aside id="itineraryDrawer" class="fixed top-0 right-0 z-40 w-full sm:w-96 h-full bg-white shadow-2xl border-l border-slate-200 transform translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <!-- Drawer Header -->
        <div class="p-4 border-b border-slate-200 flex items-center justify-between bg-slate-900 text-white">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-route text-amber-400 text-lg"></i>
                <h3 class="font-bold text-base">自訂行程路線圖</h3>
            </div>
            <button onclick="toggleItineraryDrawer()" class="p-1 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
        </div>

        <!-- Itinerary Stats Summary -->
        <div class="bg-brand-50 p-3 border-b border-brand-100 flex items-center justify-between text-xs text-brand-900 font-medium">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-flag-checkered text-brand-600"></i>
                <span>共 <b id="itinSpotCount" class="text-brand-700">0</b> 個景點</span>
            </div>
            <div class="flex items-center gap-3">
                <span>預估里程: <b id="itinDistance" class="text-slate-900">0 km</b></span>
            </div>
        </div>

        <!-- Itinerary Items Timeline List -->
        <div id="itineraryList" class="flex-1 overflow-y-auto p-4 space-y-3">
            <!-- Timeline items rendered dynamically -->
        </div>

        <!-- Drawer Footer Buttons -->
        <div class="p-4 border-t border-slate-200 bg-slate-50 space-y-2">
            <button onclick="copyItineraryText()" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs sm:text-sm rounded-xl shadow-sm transition flex items-center justify-center gap-2">
                <i class="fa-regular fa-copy"></i> 複製文字行程至剪貼簿
            </button>
            <button onclick="clearItinerary()" class="w-full py-2 text-rose-600 hover:bg-rose-50 font-medium text-xs rounded-xl border border-rose-200 transition">
                <i class="fa-solid fa-trash-can mr-1"></i> 清空行程
            </button>
        </div>
    </aside>

    <!-- Spot Details Modal -->
    <div id="detailModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-hidden flex flex-col transform transition-all duration-200 border border-slate-200">
            <!-- Modal Cover Header -->
            <div class="relative h-56 bg-slate-100 flex-none">
                <img id="modalImg" src="" alt="" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x400/e2e8f0/475569?text=Taiwan+Travel'">
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950/80 via-slate-900/20 to-transparent"></div>
                <button onclick="closeDetailModal()" class="absolute top-3 right-3 bg-black/50 hover:bg-black/80 text-white p-2 rounded-full shadow transition">
                    <i class="fa-solid fa-xmark text-sm"></i>
                </button>
                <div class="absolute bottom-4 left-4 right-4 text-white">
                    <div class="flex items-center gap-2 mb-1">
                        <span id="modalCategory" class="px-2.5 py-0.5 rounded-md text-[11px] font-bold bg-brand-600 text-white"></span>
                        <span id="modalRegion" class="px-2.5 py-0.5 rounded-md text-[11px] font-medium bg-white/20 text-white backdrop-blur-xs"></span>
                    </div>
                    <h3 id="modalTitle" class="text-2xl font-black leading-tight"></h3>
                </div>
            </div>

            <!-- Modal Content Body -->
            <div class="p-5 overflow-y-auto space-y-4 flex-1 text-xs sm:text-sm">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-1 text-amber-500 font-bold">
                        <i class="fa-solid fa-star"></i>
                        <span id="modalRating" class="text-slate-800"></span>
                        <span class="text-slate-400 font-normal text-xs">(<span id="modalReviews"></span> 則好評)</span>
                    </div>
                    <div class="text-slate-500 text-xs">
                        <i class="fa-regular fa-clock text-brand-600 mr-1"></i>建議季節: <span id="modalSeason" class="font-medium text-slate-800"></span>
                    </div>
                </div>

                <div>
                    <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-1">景點簡介</h4>
                    <p id="modalDesc" class="text-slate-600 leading-relaxed"></p>
                </div>

                <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-2 text-xs">
                    <div class="flex items-start text-slate-600">
                        <i class="fa-solid fa-location-dot mt-0.5 mr-2 text-brand-600"></i>
                        <span id="modalAddress"></span>
                    </div>
                    <div id="modalTags" class="flex flex-wrap gap-1.5 pt-1"></div>
                </div>
            </div>

            <!-- Modal Actions Footer -->
            <div class="p-4 border-t border-slate-200 bg-slate-50 flex gap-2 flex-none">
                <button id="modalFavBtn" class="flex-1 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm border border-slate-200 flex items-center justify-center gap-1.5 transition">
                    <i class="fa-regular fa-heart"></i>
                    <span>收藏</span>
                </button>
                <button id="modalItinBtn" class="flex-1 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm bg-slate-200 hover:bg-slate-300 text-slate-800 flex items-center justify-center gap-1.5 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>加行程</span>
                </button>
                <button id="modalDeleteCustomBtn" class="hidden py-2.5 px-3 bg-rose-100 hover:bg-rose-200 text-rose-700 rounded-xl font-medium text-xs sm:text-sm transition flex items-center justify-center gap-1">
                    <i class="fa-solid fa-trash-can"></i>
                    <span>刪除</span>
                </button>
                <a id="modalNavBtn" target="_blank" href="#" class="flex-1 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm bg-brand-600 hover:bg-brand-700 text-white flex items-center justify-center gap-1.5 transition shadow-sm">
                    <i class="fa-solid fa-diamond-turn-right"></i>
                    <span>導航</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Add Custom Spot Modal -->
    <div id="addSpotModal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-hidden flex flex-col border border-slate-200">

            showToast(`已切換為 ${type === 'standard' ? '標準街道圖' : type === 'satellite' ? '衛星影像圖' : '暗夜奢華圖'}`);

            showToast('正在獲取您的定位...');
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const { latitude, longitude } = pos.coords;
                    map.flyTo([latitude, longitude], 13);
                    L.circleMarker([latitude, longitude], {
                        radius: 8,
                        fillColor: '#3b82f6',
                        color: '#ffffff',
                        weight: 3,
                        opacity: 1,
                        fillOpacity: 0.9

            return getAllSpots().filter(spot => {
                const matchRegion = activeRegion === 'ALL' || spot.region === activeRegion;
                const matchCategory = activeCategory === 'ALL' || spot.category === activeCategory;
                const matchFav = !showOnlyFavorites || favorites.includes(spot.id);
                
                const q = searchQuery.toLowerCase().trim();
                const matchSearch = !q || 
                    spot.name.toLowerCase().includes(q) ||
                    spot.city.toLowerCase().includes(q) ||
                    spot.desc.toLowerCase().includes(q) ||
                    spot.tags.some(t => t.toLowerCase().includes(q));

                return matchRegion && matchCategory && matchFav && matchSearch;
            });
        }

        function renderItineraryPolyline() {
            routePolylineLayer.clearLayers();
            if (itinerary.length < 2) {
                document.getElementById('itinDistance').textContent = '0 km';
                return;
            }

            const points = [];
            let totalKm = 0;

            itinerary.forEach((id, idx) => {
                const spot = getAllSpots().find(s => s.id === id);
                if (spot) {
                    points.push([spot.lat, spot.lng]);
                    if (idx > 0) {
                        const prevSpot = getAllSpots().find(s => s.id === itinerary[idx - 1]);
                        if (prevSpot) {
                            totalKm += getDistanceKm(prevSpot.lat, prevSpot.lng, spot.lat, spot.lng);
                        }
                    }
                }
            });

            document.getElementById('itinDistance').textContent = `${totalKm.toFixed(1)} km`;

            const polyline = L.polyline(points, {
                color: '#059669',
                weight: 4,
                opacity: 0.8,
                className: 'route-polyline'
            });

            routePolylineLayer.addLayer(polyline);
        }

        // Haversine Distance Formula
        function getDistanceKm(lat1, lon1, lat2, lon2) {
            const R = 6371;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        }

        function copyItineraryText() {
            if (itinerary.length === 0) {
                showToast('目前無行程可複製');
                return;
            }
            const lines = itinerary.map((id, idx) => {
                const s = getAllSpots().find(x => x.id === id);
                return `${idx + 1}. ${s ? s.name : ''} (${s ? s.city : ''})`;
            });

            const text = `【台灣自由行自訂行程表】\n` + lines.join('\n') + `\n預估路線總里程：${document.getElementById('itinDistance').textContent}`;

            const textarea = document.createElement('textarea');
            textarea.value = text;
            document.body.appendChild(textarea);
            textarea.select();
            document.execCommand('copy');
            document.body.removeChild(textarea);

            showToast('已成功複製行程文字至剪貼簿！', 'success');
        }

        function openDetailModal(id) {
            const spot = getAllSpots().find(s => s.id === id);
            if (!spot) return;

            document.getElementById('modalImg').src = spot.img;
            document.getElementById('modalTitle').textContent = spot.name;
            document.getElementById('modalCategory').textContent = spot.category;
            document.getElementById('modalRegion').textContent = `${spot.region} • ${spot.city}`;
            document.getElementById('modalRating').textContent = spot.rating;
            document.getElementById('modalReviews').textContent = spot.reviews.toLocaleString();
            document.getElementById('modalSeason').textContent = spot.bestSeason;
            document.getElementById('modalDesc').textContent = spot.desc;
            document.getElementById('modalAddress').textContent = spot.address;

            const tagsBox = document.getElementById('modalTags');
            tagsBox.innerHTML = spot.tags.map(t => `<span class="bg-slate-200/70 text-slate-700 px-2 py-0.5 rounded text-[10px]">#${t}</span>`).join('');

            document.getElementById('modalNavBtn').href = `https://www.google.com/maps/dir/?api=1&destination=${spot.lat},${spot.lng}`;

            updateModalButtons(spot.id);

            // Toggle custom spot delete button visibility
            const isCustom = customSpots.some(s => s.id === id);
            const deleteBtn = document.getElementById('modalDeleteCustomBtn');
            if (isCustom) {
                deleteBtn.classList.remove('hidden');
                deleteBtn.onclick = () => deleteCustomSpot(id);
            } else {
                deleteBtn.classList.add('hidden');
            }

            document.getElementById('modalFavBtn').onclick = () => {
                toggleFavorite(spot.id);
                updateModalButtons(spot.id);
            };

            document.getElementById('modalItinBtn').onclick = () => {
                toggleItinerary(spot.id);
                updateModalButtons(spot.id);
            };

            document.getElementById('detailModal').classList.remove('hidden');
        }

        function updateModalButtons(id) {
            const isFav = favorites.includes(id);
            const isItin = itinerary.includes(id);

            const favBtn = document.getElementById('modalFavBtn');
            favBtn.className = isFav 
                ? "flex-1 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm border border-rose-200 bg-rose-50 text-rose-600 flex items-center justify-center gap-1.5 transition"
                : "flex-1 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm border border-slate-200 text-slate-700 flex items-center justify-center gap-1.5 transition";
            favBtn.innerHTML = `<i class="fa-${isFav ? 'solid text-rose-500' : 'regular'} fa-heart"></i><span>${isFav ? '已收藏' : '收藏'}</span>`;

            const itinBtn = document.getElementById('modalItinBtn');
            itinBtn.className = isItin
                ? "flex-1 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm bg-amber-400 text-slate-900 flex items-center justify-center gap-1.5 transition font-bold"
                : "flex-1 py-2.5 px-3 rounded-xl font-medium text-xs sm:text-sm bg-slate-200 text-slate-800 flex items-center justify-center gap-1.5 transition";
            itinBtn.innerHTML = `<i class="fa-solid ${isItin ? 'fa-circle-check' : 'fa-plus'}"></i><span>${isItin ? '已加行程' : '加行程'}</span>`;
        }

        function closeDetailModal() {
            document.getElementById('detailModal').classList.add('hidden');
        }

        // "Surprise Me" Randomizer Logic
        function openSurpriseModal() {
            document.getElementById('surpriseCard').classList.add('hidden');
            document.getElementById('goSurpriseBtn').classList.add('hidden');
            document.getElementById('goSurpriseBtn').classList.remove('flex');
            document.getElementById('spinBtn').classList.remove('hidden');
            document.getElementById('surpriseModal').classList.remove('hidden');
        }

        function closeSurpriseModal() {
            document.getElementById('surpriseModal').classList.add('hidden');
        }

        function spinSurpriseSpot() {
            const dice = document.getElementById('diceIcon');
            dice.classList.add('animate-spin');

            setTimeout(() => {
                dice.classList.remove('animate-spin');
                const spots = getAllSpots();
                const randomSpot = spots[Math.floor(Math.random() * spots.length)];
                selectedSurpriseSpot = randomSpot;

                document.getElementById('surpriseImg').src = randomSpot.img;
                document.getElementById('surpriseCat').textContent = randomSpot.category;
                document.getElementById('surpriseTitle').textContent = randomSpot.name;
                document.getElementById('surpriseCity').querySelector('span').textContent = `${randomSpot.region} • ${randomSpot.city}`;

                document.getElementById('surpriseCard').classList.remove('hidden');
                document.getElementById('spinBtn').classList.add('hidden');
                const goBtn = document.getElementById('goSurpriseBtn');
                goBtn.classList.remove('hidden');
                goBtn.classList.add('flex');
            }, 600);
        }

        // Custom Spot Management Methods
        function openAddSpotModal(lat = '', lng = '') {
            if (lat !== '' && lng !== '') {
                document.getElementById('spotLat').value = lat;
                document.getElementById('spotLng').value = lng;
            }
            document.getElementById('addSpotModal').classList.remove('hidden');
        }

        function closeAddSpotModal() {
            document.getElementById('addSpotModal').classList.add('hidden');
        }

        function startPickLocationOnMap() {
            closeAddSpotModal();
            isPickingLocation = true;
            document.getElementById('mapPickerBanner').classList.remove('hidden');
            
            map.once('click', (e) => {
                if (!isPickingLocation) return;
                const { lat, lng } = e.latlng;
                isPickingLocation = false;
                document.getElementById('mapPickerBanner').classList.add('hidden');
                openAddSpotModal(lat.toFixed(6), lng.toFixed(6));
                showToast(`已選取座標: ${lat.toFixed(4)}, ${lng.toFixed(4)}`, 'success');
            });
        }

        function cancelPickLocation() {
            isPickingLocation = false;
            document.getElementById('mapPickerBanner').classList.add('hidden');
            openAddSpotModal();
        }

        function handleAddSpotSubmit(e) {
            e.preventDefault();
            const name = document.getElementById('spotName').value.trim();
            const region = document.getElementById('spotRegion').value;
            const city = document.getElementById('spotCity').value.trim();
            const category = document.getElementById('spotCategory').value;
            const rating = parseFloat(document.getElementById('spotRating').value) || 4.8;
            const lat = parseFloat(document.getElementById('spotLat').value);
            const lng = parseFloat(document.getElementById('spotLng').value);
            const desc = document.getElementById('spotDesc').value.trim() || '使用者新增之私房景點';
            const img = document.getElementById('spotImg').value.trim() || 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=600&auto=format&fit=crop';
            const address = document.getElementById('spotAddress').value.trim() || `${city}在地熱門景點`;
            const tagsInput = document.getElementById('spotTags').value.trim();
            const tags = tagsInput ? tagsInput.split(',').map(t => t.trim()) : ['私房景點', category];

            const newSpot = {
                id: Date.now(),
                name,
                region,
                city,
                category,
                lat,
                lng,
                rating,
                reviews: 1,
                img,
                desc,
                address,
                bestSeason: '四季皆宜',
                tags,
                isCustom: true
            };

            customSpots.push(newSpot);
            localStorage.setItem('tw_custom_spots', JSON.stringify(customSpots));

            closeAddSpotModal();
            document.getElementById('addSpotForm').reset();

            showToast(`成功新增景點：${name}！`, 'success');
            renderUI();

            map.flyTo([lat, lng], 13, { animate: true, duration: 1 });
        }

        function deleteCustomSpot(id) {
            const spot = customSpots.find(s => s.id === id);
            if (!spot) return;

            customSpots = customSpots.filter(s => s.id !== id);
            favorites = favorites.filter(fId => fId !== id);
            itinerary = itinerary.filter(iId => iId !== id);

            localStorage.setItem('tw_custom_spots', JSON.stringify(customSpots));
            localStorage.setItem('tw_map_favs', JSON.stringify(favorites));
            localStorage.setItem('tw_map_itin', JSON.stringify(itinerary));

            closeDetailModal();
            updateBadges();
            renderUI();
            showToast(`已刪除自訂景點：${spot.name}`);
        }

        // Mobile View Switcher
        function setMobileView(view) {
            const sidebar = document.getElementById('sidebar');
            const listBtn = document.getElementById('mobileShowListBtn');
            const mapBtn = document.getElementById('mobileShowMapBtn');

            if (view === 'list') {
                sidebar.classList.remove('hidden');
                sidebar.classList.add('w-full');
                listBtn.className = "px-3 py-1.5 rounded-lg bg-brand-600 text-white font-bold transition";
                mapBtn.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
            } else {
                sidebar.classList.add('hidden');
                listBtn.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
                mapBtn.className = "px-3 py-1.5 rounded-lg bg-brand-600 text-white font-bold transition";
            }
        }

        // Toast Message Helper
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            
            const isSuccess = type === 'success';
            toast.className = `px-4 py-2.5 rounded-xl shadow-lg border text-xs sm:text-sm font-medium transition duration-300 transform translate-y-4 opacity-0 flex items-center gap-2 ${
                isSuccess 
                    ? 'bg-slate-900 text-white border-slate-800' 
                    : 'bg-white text-slate-800 border-slate-200'
            }`;
            
            toast.innerHTML = `
                <i class="fa-solid ${isSuccess ? 'fa-circle-check text-emerald-400' : 'fa-circle-info text-brand-600'}"></i>
                <span>${msg}</span>
            `;

            container.appendChild(toast);

            setTimeout(() => toast.classList.remove('translate-y-4', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('translate-y-4', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
